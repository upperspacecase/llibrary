<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LandBook Dashboard</title>
<link rel="icon" type="image/jpeg" href="/favicon1.jpg">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Libre+Baskerville:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface-container-high": "#e2e8f8",
        "on-tertiary-fixed": "#002114",
        "on-secondary-fixed-variant": "#404754",
        "surface-tint": "#3f6653",
        "surface-container-highest": "#dce2f3",
        "surface-container": "#e7eefe",
        "secondary-fixed": "#dce2f3",
        "secondary-fixed-dim": "#c0c7d6",
        "on-primary": "#ffffff",
        "surface": "#f9f9ff",
        "tertiary-container": "#00452e",
        "on-surface-variant": "#414844",
        "surface-dim": "#d3daea",
        "error": "#ba1a1a",
        "secondary": "#585f6c",
        "on-secondary-container": "#5e6572",
        "on-primary-fixed": "#002114",
        "outline-variant": "#c1c8c2",
        "outline": "#717973",
        "surface-container-lowest": "#ffffff",
        "surface-container-low": "#f0f3ff",
        "on-tertiary-fixed-variant": "#0e5138",
        "inverse-primary": "#a5d0b9",
        "inverse-surface": "#2a313d",
        "surface-variant": "#dce2f3",
        "on-tertiary-container": "#75b393",
        "primary": "#012d1d",
        "on-primary-container": "#86af99",
        "background": "#f9f9ff",
        "on-secondary-fixed": "#151c27",
        "tertiary": "#002d1c",
        "primary-fixed": "#c1ecd4",
        "tertiary-fixed": "#b1f0ce",
        "surface-bright": "#f9f9ff",
        "primary-fixed-dim": "#a5d0b9",
        "primary-container": "#1b4332",
        "on-error-container": "#93000a",
        "on-error": "#ffffff",
        "tertiary-fixed-dim": "#95d4b3",
        "on-tertiary": "#ffffff",
        "on-secondary": "#ffffff",
        "error-container": "#ffdad6",
        "on-primary-fixed-variant": "#274e3d",
        "on-surface": "#151c27",
        "secondary-container": "#dce2f3",
        "on-background": "#151c27",
        "inverse-on-surface": "#ebf1ff",
        "brand-forest": "#1B3A2F",
        "brand-sage": "#8B9A7E",
        "brand-terracotta": "#C4705A",
        "brand-amber": "#D4A574",
        "brand-cream": "#F5F1E8",
        "brand-charcoal": "#2C2C2C",
      },
      borderRadius: {
        none: "0px",
        DEFAULT: "0px",
      },
      fontFamily: {
        headline: ["Inter", "sans-serif"],
        body: ["Inter", "sans-serif"],
        label: ["Inter", "sans-serif"],
        serif: ["Libre Baskerville", "serif"],
      },
    },
  },
};
</script>
<style>
body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.a4-page {
  width: 210mm;
  min-height: 297mm;
}
.gauge-svg { transform: rotate(-90deg); }
.hairline { height: 0.5px; width: 100%; background-color: #8B9A7E; }
.serif-title { font-family: 'Libre Baskerville', serif; font-weight: 700; font-style: normal; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { animation: spin 1s linear infinite; }
</style>
</head>
<body class="bg-surface text-on-surface">

<!-- Sidebar -->
<aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-brand-cream overflow-y-auto px-8 py-10 no-scrollbar z-50">
  <div class="mb-12">
    <div class="flex items-center gap-3 mb-1">
      <span class="serif-title text-lg text-brand-forest">LANDBOOK</span>
    </div>
    <p class="text-[10px] font-bold tracking-[0.2em] text-brand-sage uppercase" id="sidebar-version">V2.0</p>
  </div>
  <nav id="sidebar-nav" class="space-y-1"></nav>
  <div class="mt-12 pt-8">
    <div class="hairline mb-8"></div>
    <button id="refresh-btn" class="flex items-center gap-3 px-4 py-2 text-brand-forest hover:bg-brand-sage/10 transition-colors duration-150 text-sm tracking-tight w-full">
      <span class="material-symbols-outlined" style="font-size:20px">sync</span>
      <span>Update Data</span>
    </button>
    <p id="data-status" class="px-4 mt-2 text-[10px] uppercase tracking-widest text-brand-sage"></p>
  </div>
</aside>

<!-- Main Content Canvas -->
<main class="ml-64 p-12 min-h-screen flex justify-center items-start bg-brand-cream/50">
  <div id="canvas" class="a4-page bg-brand-cream flex flex-col"></div>
</main>

<script type="module" src="/src/pages/landbook-v2.js"></script>
</body>
</html>
