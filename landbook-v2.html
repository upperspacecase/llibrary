<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LandBook Dashboard</title>
<link rel="icon" type="image/jpeg" href="/favicon1.jpg">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        secondary: "#5e5e5e",
        "on-secondary-fixed-variant": "#3b3b3c",
        "on-tertiary-fixed-variant": "#e2e2e2",
        "primary-container": "#3b3b3b",
        "tertiary-fixed-dim": "#474747",
        error: "#ba1a1a",
        outline: "#777777",
        "on-primary": "#e2e2e2",
        background: "#f9f9f9",
        "surface-container": "#eeeeee",
        "secondary-fixed-dim": "#acabab",
        "secondary-container": "#d5d4d4",
        "on-error-container": "#410002",
        "surface-bright": "#f9f9f9",
        "outline-variant": "#c6c6c6",
        "on-background": "#1a1c1c",
        "on-error": "#ffffff",
        "on-tertiary": "#e2e2e2",
        surface: "#f9f9f9",
        "inverse-surface": "#2f3131",
        "inverse-on-surface": "#f0f1f1",
        "secondary-fixed": "#c7c6c6",
        "tertiary-fixed": "#5e5e5e",
        "tertiary-container": "#747474",
        primary: "#000000",
        "surface-container-high": "#e8e8e8",
        "on-primary-fixed-variant": "#e2e2e2",
        "on-secondary": "#ffffff",
        "surface-tint": "#5e5e5e",
        tertiary: "#3b3b3b",
        "on-surface-variant": "#474747",
        "surface-container-lowest": "#ffffff",
        "primary-fixed-dim": "#474747",
        "inverse-primary": "#c6c6c6",
        "surface-container-highest": "#e2e2e2",
        "on-secondary-fixed": "#1b1c1c",
        "error-container": "#ffdad6",
        "on-secondary-container": "#1b1c1c",
        "primary-fixed": "#5e5e5e",
        "on-primary-fixed": "#ffffff",
        "surface-variant": "#e2e2e2",
        "on-tertiary-fixed": "#ffffff",
        "surface-container-low": "#f3f3f4",
        "surface-dim": "#dadada",
        "on-primary-container": "#ffffff",
        "on-surface": "#1a1c1c",
        "on-tertiary-container": "#ffffff",
      },
      borderRadius: {
        DEFAULT: "0px",
        lg: "0px",
        xl: "0px",
        full: "0px",
      },
      fontFamily: {
        headline: ["Inter"],
        body: ["Inter"],
        label: ["Inter"],
      },
    },
  },
};
</script>
<style>
body { font-family: 'Inter', sans-serif; }
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.a4-page {
  width: 210mm;
  min-height: 297mm;
  box-shadow: 0 0 10px rgba(0,0,0,0.05);
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { animation: spin 1s linear infinite; }
</style>
</head>
<body class="bg-surface text-on-surface">

<!-- Sidebar -->
<aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-zinc-100 border-r-0 overflow-y-auto px-8 py-10 no-scrollbar z-50">
  <div class="mb-12">
    <div class="flex items-center gap-3 mb-1">
      <span class="text-lg font-black tracking-tighter text-zinc-900">LANDBOOK</span>
    </div>
    <p class="font-['Inter'] text-xs uppercase tracking-widest text-zinc-500" id="sidebar-version">V2.0</p>
  </div>
  <nav id="sidebar-nav" class="space-y-1"></nav>
  <div class="mt-12 pt-8 border-t border-zinc-200">
    <button id="refresh-btn" class="flex items-center gap-3 px-4 py-2 text-zinc-500 hover:bg-zinc-200 transition-colors duration-150 font-['Inter'] text-sm tracking-tight w-full">
      <span class="material-symbols-outlined" style="font-size:20px">sync</span>
      <span>Update Data</span>
    </button>
    <p id="data-status" class="px-4 mt-2 text-[10px] uppercase tracking-widest text-zinc-400"></p>
  </div>
</aside>

<!-- Main Content Canvas -->
<main class="ml-64 p-12 min-h-screen flex justify-center items-start bg-zinc-50">
  <div id="canvas" class="a4-page bg-surface-container-lowest flex flex-col"></div>
</main>

<script type="module" src="/src/pages/landbook-v2.js"></script>
</body>
</html>
