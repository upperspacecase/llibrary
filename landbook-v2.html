<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LandBook Dashboard</title>
<link rel="icon" type="image/jpeg" href="/favicon1.jpg">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#012d1d",
        "primary-container": "#1b4332",
        "on-primary": "#ffffff",
        "on-primary-container": "#86af99",
        secondary: "#585f6c",
        "secondary-container": "#dce2f3",
        "on-secondary": "#ffffff",
        "on-secondary-container": "#151c27",
        tertiary: "#002d1c",
        "tertiary-container": "#00452e",
        "on-tertiary": "#ffffff",
        "on-tertiary-container": "#86af99",
        error: "#ba1a1a",
        "error-container": "#ffdad6",
        "on-error": "#ffffff",
        "on-error-container": "#410002",
        background: "#f9f9ff",
        "on-background": "#151c27",
        surface: "#f9f9ff",
        "surface-container": "#e7eefe",
        "surface-container-high": "#dce4f3",
        "surface-container-highest": "#d1dae8",
        "surface-container-low": "#f0f4ff",
        "surface-container-lowest": "#ffffff",
        "surface-bright": "#f9f9ff",
        "surface-dim": "#d5dce8",
        "surface-variant": "#c1c8c2",
        "surface-tint": "#012d1d",
        "on-surface": "#151c27",
        "on-surface-variant": "#3e4a42",
        "inverse-surface": "#2a3140",
        "inverse-on-surface": "#edf1fc",
        "inverse-primary": "#86af99",
        outline: "#717973",
        "outline-variant": "#c1c8c2",
        "primary-fixed": "#a2d5b8",
        "primary-fixed-dim": "#86af99",
        "on-primary-fixed": "#002114",
        "on-primary-fixed-variant": "#012d1d",
        "secondary-fixed": "#dce2f3",
        "secondary-fixed-dim": "#c0c6d7",
        "on-secondary-fixed": "#151c27",
        "on-secondary-fixed-variant": "#404754",
        "tertiary-fixed": "#a2d5b8",
        "tertiary-fixed-dim": "#86af99",
        "on-tertiary-fixed": "#002114",
        "on-tertiary-fixed-variant": "#002d1c",
      },
      borderRadius: {
        DEFAULT: "0px",
        lg: "0px",
        xl: "0px",
        full: "9999px",
      },
      fontFamily: {
        headline: ["Inter"],
        body: ["Inter"],
        label: ["Inter"],
        serif: ["Libre Baskerville", "serif"],
      },
    },
  },
};
</script>
<style>
body { font-family: 'Inter', sans-serif; }
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.editorial-paper { background-color: #F5F1E8; }
.compact-body { line-height: 1.4; letter-spacing: -0.01em; font-size: 0.9375rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { animation: spin 1s linear infinite; }
</style>
</head>
<body class="bg-surface text-on-surface">

<div class="flex">
<!-- Sidebar -->
<aside id="sidebar" class="hidden md:flex flex-col w-72 bg-[#E9E9E9] text-[#012d1d] font-['Inter'] text-sm font-medium border-r-[0.5pt] border-[#c1c8c2] py-8 relative">
  <div class="fixed top-0 left-0 w-72 h-full flex flex-col py-8 overflow-y-auto no-scrollbar">
    <div class="px-6 mb-12">
      <div class="font-serif uppercase tracking-[0.2em] text-lg text-[#012d1d]">Land<em>book</em></div>
      <p class="text-xs uppercase tracking-widest text-slate-500 mt-1" id="sidebar-version">V2.0</p>
    </div>
    <nav id="sidebar-nav" class="space-y-1 flex-1"></nav>
    <div class="mt-8 px-6">
      <button id="refresh-btn" class="w-full flex items-center justify-center gap-3 px-4 py-2.5 bg-primary text-on-primary text-sm font-bold transition-colors duration-150 mb-4">
        <span class="material-symbols-outlined" style="font-size:20px">sync</span>
        <span>Update Data</span>
      </button>
      <a href="#" class="w-full bg-primary text-on-primary px-4 py-2.5 text-sm font-bold text-center block mb-4">Export Full Ledger</a>
      <div class="flex flex-col gap-1">
        <a href="#" class="flex items-center px-0 py-2 text-slate-600 hover:text-[#012d1d] text-sm">
          <span class="material-symbols-outlined mr-2" style="font-size:18px">settings</span>Settings
        </a>
        <a href="#" class="flex items-center px-0 py-2 text-slate-600 hover:text-[#012d1d] text-sm">
          <span class="material-symbols-outlined mr-2" style="font-size:18px">help</span>Support
        </a>
      </div>
      <p id="data-status" class="mt-3 text-[10px] uppercase tracking-widest text-slate-400"></p>
    </div>
  </div>
</aside>

<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col min-h-screen">
  <div class="flex-1 editorial-paper p-12 lg:p-24 overflow-y-auto">
    <div id="canvas" class="max-w-[800px] mx-auto shadow-2xl bg-white min-h-[1100px] p-16 flex flex-col"></div>
  </div>
</main>
</div>

<script type="module" src="/src/pages/landbook-v2.js"></script>
</body>
</html>
