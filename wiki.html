<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/favicon1.jpg">
  <title>Odemira Wiki — Libraries</title>
  <meta name="description" content="Everything you need to know about the Odemira region.">
  <meta property="og:title" content="Odemira Wiki — Libraries">
  <meta property="og:description" content="Everything you need to know about the Odemira region.">
  <meta property="og:image" content="https://llibrary-eight.vercel.app/metaimage.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://llibrary-eight.vercel.app/metaimage.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>

  <header class="header page-header">
    <a href="/" class="logo">
      <img src="/logo.svg" alt="LandLibrary" class="logo-img">
    </a>
    <div class="header-nav">
      <a href="/about">About</a>
      <a href="/create">Create LandBook</a>
      <a href="/commons" class="active">Regional Commons</a>
      <a href="/chat">Chat with Land</a>
      <div class="lang-toggle">
        <button class="lang-toggle-trigger" aria-expanded="false">
          <span class="lang-toggle-label">EN</span>
          <svg class="lang-toggle-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="lang-toggle-menu">
          <button data-lang="en">EN</button>
          <button data-lang="pt">PT</button>
        </div>
      </div>
    </div>
  </header>

  <div class="page-body">
    <div class="wiki-layout">
      <aside class="wiki-sidebar" id="wiki-sidebar"></aside>
      <main class="wiki-content" id="wiki-content"></main>
    </div>
  </div>

  <!-- Mobile wiki nav FAB + drawer -->
  <button class="wiki-fab" id="wiki-fab" aria-label="Open section navigation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="wiki-mobile-drawer-backdrop" id="wiki-drawer-backdrop"></div>
  <div class="wiki-mobile-drawer" id="wiki-drawer">
    <div class="wiki-mobile-drawer-handle"></div>
    <div class="wiki-mobile-drawer-title">Sections</div>
    <nav id="wiki-drawer-nav"></nav>
  </div>

  <script>
    function showComingSoon() { var o = document.createElement('div'); o.className = 'coming-soon-overlay'; o.innerHTML = '<div class="coming-soon-card"><h3>Coming Soon</h3><p>LandBook is under development. Check back soon!</p><button onclick="this.closest(\'.coming-soon-overlay\').remove()">Got it</button></div>'; o.addEventListener('click', function (e) { if (e.target === o) o.remove() }); document.body.appendChild(o) }
  </script>
  <script type="module" src="/src/pages/wiki.js"></script>
</body>

</html>
