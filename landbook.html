<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Landbook — LandLibrary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta property="og:title" content="Landbook — LandLibrary">
  <meta property="og:image" content="https://llibrary-eight.vercel.app/metaimage.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://llibrary-eight.vercel.app/metaimage.png">
</head>

<body class="bg-earth-50 text-earth-900 font-sans antialiased">

  <!-- App Shell -->
  <div class="flex h-screen w-full overflow-hidden">

    <!-- Desktop Sidebar -->
    <aside id="sidebar" class="hidden lg:flex w-[260px] bg-earth-100 flex-col border-r border-earth-200/50 shrink-0">
      <div class="px-6 pt-6 pb-4">
        <h1 class="font-sans font-semibold text-lg tracking-[0.2em] text-earth-900 uppercase">LandBook</h1>
        <p id="sidebar-subtitle" class="text-[11px] text-earth-500 uppercase tracking-widest mt-0.5"></p>
      </div>
      <nav id="sidebar-nav" class="px-4 flex flex-col gap-1 mt-2">
        <!-- JS populates -->
      </nav>
    </aside>

    <!-- Main Content -->
    <main id="app-main" class="flex-1 overflow-y-auto overflow-x-hidden relative pb-24 lg:pb-0">
      <!-- Loading state -->
      <div id="loading-view" class="flex items-center justify-center h-full">
        <div class="text-center">
          <div class="w-8 h-8 border-2 border-earth-300 border-t-earth-800 rounded-full animate-spin mx-auto mb-4"></div>
          <p class="text-earth-500 text-sm">Loading your landbook...</p>
        </div>
      </div>

      <!-- Not found state -->
      <div id="notfound-view" class="hidden flex items-center justify-center h-full">
        <div class="text-center max-w-sm px-6">
          <h3 class="font-serif text-2xl mb-2">Landbook not found</h3>
          <p class="text-earth-500 mb-6">This landbook may have been removed or the link is incorrect.</p>
          <a href="/create" class="inline-block px-6 py-3 bg-earth-900 text-white rounded-lg font-medium text-sm hover:opacity-80 transition-opacity">Create a Landbook</a>
        </div>
      </div>

      <!-- View containers (toggled by JS) -->
      <div id="view-dashboard" class="hidden"></div>
      <div id="view-map" class="hidden h-full"></div>
      <div id="view-chat" class="hidden h-full"></div>
      <div id="view-vault" class="hidden"></div>
      <div id="view-capture" class="hidden"></div>
    </main>

    <!-- Mobile Bottom Nav -->
    <div id="mobile-nav" class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-earth-50 border-t border-earth-200 flex justify-around items-center px-4 h-20 pb-4">
      <!-- JS populates -->
    </div>
  </div>

  <script type="module" src="/src/pages/landbook.js"></script>
</body>

</html>
