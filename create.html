<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/favicon1.jpg">
  <title>Create Your Landbook — Libraries</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <meta property="og:title" content="Create Your Landbook — Libraries">
  <meta property="og:image" content="https://llibrary-eight.vercel.app/metaimage.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://llibrary-eight.vercel.app/metaimage.png">
</head>

<body>

  <header class="header page-header">
    <a href="/" class="logo">
      <img src="/logo.svg" alt="LandLibrary" class="logo-img">
    </a>
    <div class="header-nav">
      <a href="/">Home</a>
      <a href="/commons">The Commons</a>
      <a href="#" onclick="event.preventDefault();showComingSoon()">Chat with Land</a>
      <a href="/create" class="active">Create LandBook</a>
      <div class="lang-toggle">
        <button class="lang-toggle-trigger" aria-expanded="false">
          <span class="lang-toggle-label">EN</span>
          <svg class="lang-toggle-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="lang-toggle-menu">
          <button data-lang="en">EN</button>
          <button data-lang="pt">PT</button>
        </div>
      </div>
    </div>
  </header>

  <div class="page-body">
    <div class="create-layout">
      <div class="create-map-area">
        <div id="create-map"></div>
        <div class="create-map-instructions" id="map-instructions" data-i18n="create.instructions">Click on the map to
          start drawing your land boundary</div>
        <div class="create-map-toolbar" id="map-toolbar" style="display:none;">
          <button class="btn-small" id="btn-undo" data-i18n="create.undo">Undo</button>
          <button class="btn-small" id="btn-clear" data-i18n="create.clear">Clear</button>
          <button class="btn-small active" id="btn-close" data-i18n="create.close">Close Boundary</button>
        </div>
      </div>
      <div class="create-sidebar">
        <h2>Create Your Landbook</h2>
        <p class="create-desc">Enter your address and we'll find your land.</p>

        <div class="create-search" style="position:relative;">
          <input type="text" id="search-input" placeholder="Search for your land..." autocomplete="off">
          <button class="btn-small" id="btn-search">Find</button>
          <ul class="search-suggestions" id="search-suggestions"></ul>
        </div>

        <!-- Shown after boundary is placed -->
        <div id="boundary-result" style="display:none;">
          <div class="create-stat" style="margin-bottom:12px;">
            <span class="stat-label">Address</span>
            <span class="stat-value" id="stat-address">&mdash;</span>
          </div>
          <div style="display:flex;gap:12px;margin-bottom:24px;">
            <div class="lb-metric-badge" style="flex:1;">
              <div class="badge-value" id="stat-area">&mdash;</div>
              <div class="badge-label">Area</div>
            </div>
            <div class="lb-metric-badge" style="flex:1;">
              <div class="badge-value" id="stat-perimeter">&mdash;</div>
              <div class="badge-label">Perimeter</div>
            </div>
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Drag the points to adjust your boundary.</p>
          <button class="btn-primary" id="btn-create" disabled style="width:100%;text-align:center;">Generate Landbook</button>
          <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:8px;">Your data stays private.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showComingSoon() { var o = document.createElement('div'); o.className = 'coming-soon-overlay'; o.innerHTML = '<div class="coming-soon-card"><h3>Coming Soon</h3><p>Chat with your land is under development. Check back soon!</p><button onclick="this.closest(\'.coming-soon-overlay\').remove()">Got it</button></div>'; o.addEventListener('click', function (e) { if (e.target === o) o.remove() }); document.body.appendChild(o) }
  </script>
  <script type="module" src="/src/pages/create.js"></script>
</body>

</html>
