<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Admin - LandLibrary</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <header class="header" style="position:relative; background:var(--cream); border-bottom:1px solid var(--border);">
    <a href="/" class="logo">
      <img src="/logo.svg" alt="LandLibrary" class="logo-img">
    </a>
    <div class="header-nav" style="display:flex; align-items:center; gap:12px;">
      <span style="font-size:14px; font-weight:600; opacity:0.5;">Admin</span>
      <button id="logout-btn" style="display:none; font-size:13px; padding:6px 14px; background:none; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; font-family:inherit; color:var(--muted);">Log out</button>
    </div>
  </header>

  <!-- Login -->
  <div id="login-view" class="admin-login">
    <div class="admin-login-card">
      <h2>Admin</h2>
      <p class="admin-muted">Sign in with Google to continue.</p>
      <div id="google-btn" style="display:flex; justify-content:center; margin-top:24px;"></div>
      <p id="login-error" class="admin-error"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard-view" class="admin-dashboard" style="display:none;">
    <div class="admin-container">

      <div class="admin-stats" id="stats-row"></div>

      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="submissions">Submissions</button>
        <button class="admin-tab" data-tab="contributions">Contributions</button>
        <button class="admin-tab" data-tab="resources">Resources</button>
        <button class="admin-tab" data-tab="regions">Regions</button>
        <button class="admin-tab" data-tab="pipeline">Data Pipeline</button>
      </div>

      <div class="admin-table-wrap" id="table-view">
        <table class="admin-table" id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
        <p id="empty-msg" class="admin-muted" style="display:none; text-align:center; padding:40px 0;">No records yet.</p>
      </div>

      <div id="pipeline-view" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <div>
            <span id="pipeline-summary" class="admin-muted"></span>
          </div>
          <button id="test-all-btn" class="admin-btn" style="width:auto; padding:8px 20px; font-size:13px;">Test All</button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-pipeline-table" id="pipeline-table">
            <thead>
              <tr>
                <th>Status</th>
                <th>Source</th>
                <th>HTTP</th>
                <th>Response</th>
                <th>Feeds</th>
                <th>Scope</th>
                <th>Auth</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="pipeline-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="/src/pages/admin.js"></script>
</body>

</html>
