<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Preview Report — LandLibrary</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <meta property="og:title" content="Preview Report — LandLibrary">
    <meta property="og:image" content="https://llibrary-eight.vercel.app/metaimage.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://llibrary-eight.vercel.app/metaimage.png">
</head>

<body>

    <header class="header page-header">
        <a href="/" class="logo">
            <img src="/logo.svg" alt="LandLibrary" class="logo-img">
        </a>
        <div class="header-nav">
            <a href="/about">About</a>
            <a href="/commons">Regional Commons</a>
            <div class="lang-toggle">
                <button class="lang-toggle-trigger" aria-expanded="false">
                    <span class="lang-toggle-label">EN</span>
                    <svg class="lang-toggle-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="lang-toggle-menu">
                    <button data-lang="en">EN</button>
                    <button data-lang="pt">PT</button>
                </div>
            </div>
        </div>
    </header>

    <div class="landbook-layout">
        <!-- Sidebar Navigation -->
        <aside class="landbook-sidebar" id="landbook-sidebar">
            <nav class="landbook-nav" id="landbook-nav">
                <!-- JS populates -->
            </nav>
            <div class="landbook-sidebar-actions" id="landbook-sidebar-actions">
                <!-- Populated by JS -->
            </div>
        </aside>

        <!-- Main Report Content -->
        <main class="landbook-main" id="landbook-content">
            <div class="loading-block">
                <div class="loading-spinner"></div>
                <span>Loading preview report...</span>
            </div>
        </main>
    </div>

    <script>function showComingSoon(){var o=document.createElement('div');o.className='coming-soon-overlay';o.innerHTML='<div class="coming-soon-card"><h3>Coming Soon</h3><p>This feature is under development.</p><button onclick="this.closest(\'.coming-soon-overlay\').remove()">Got it</button></div>';o.addEventListener('click',function(e){if(e.target===o)o.remove()});document.body.appendChild(o)}</script>
    <script type="module" src="/src/pages/preview.js"></script>
</body>

</html>
