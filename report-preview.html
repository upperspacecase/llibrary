<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>LandBook Report Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Version selector bar -->
  <div id="version-bar">
    <div class="version-bar-inner">
      <span class="version-label">LandBook Report</span>
      <select id="version-select">
        <option value="">Loading versions...</option>
      </select>
      <button id="share-btn" style="margin-left:auto;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;padding:6px 16px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer;">Share</button>
      <span id="version-date" class="version-date" style="margin-left:12px;"></span>
    </div>
  </div>

  <!-- Report renders here -->
  <div id="report-container"></div>

  <script type="module" src="/src/pages/report-preview.js"></script>
</body>

</html>
